<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thi Kinh Thánh: Tin Lành Ma-thi-ơ</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181825">
  <style>
    :root {
      --bg: #11111b;
      --card: #1e1e2e;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --dim: #a6adc8;
      --green: #a6e3a1;
      --green-bg: rgba(166, 227, 161, 0.18);
      --red: #f38ba8;
      --red-bg: rgba(243, 139, 168, 0.18);
      --border: #313244;
      --opt-bg: #181825;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .exam-title { font-size: 1.15rem; font-weight: bold; color: var(--accent); text-transform: uppercase; }
    .exam-sub { font-size: 0.8rem; color: var(--dim); margin-top: 2px; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .score-badge { color: #f9e2af; }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #313244;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .shake-anim {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--red) !important;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .correct-anim {
      animation: popGreen 0.6s ease-out both;
      border-color: var(--green) !important;
    }
    @keyframes popGreen {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(166, 227, 161, 0); }
      40% { transform: scale(1.02); box-shadow: 0 0 25px rgba(166, 227, 161, 0.4); }
      100% { transform: scale(1); }
    }

    .q-number {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      background: var(--opt-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
      transition: all 0.15s ease;
    }
    .opt-btn:active { transform: scale(0.98); }
    .opt-tag {
      font-weight: bold;
      color: var(--accent);
      background: rgba(137, 180, 250, 0.15);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .opt-btn.correct {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
      font-weight: bold;
    }
    .opt-btn.correct .opt-tag {
      background: var(--green);
      color: #11111b;
    }
    .opt-btn.wrong {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }
    .opt-btn.wrong .opt-tag {
      background: var(--red);
      color: #11111b;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: #181825;
      border: 2px solid var(--red);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .mock-title { font-size: 1.35rem; font-weight: 900; color: var(--red); margin-bottom: 8px; }
    .mock-desc { font-size: 0.95rem; color: var(--dim); margin-bottom: 12px; }
    .correct-info {
      background: #11111b;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      color: var(--green);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: left;
    }
    .btn-next-modal {
      background: var(--red);
      color: #11111b;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px 18px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .score-circle {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent);
      margin: 10px 0;
    }
    .btn-restart {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .wrong-review-box {
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
      background: #11111b;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="exam-title">Đề Thi Tin Lành Ma-thi-ơ</div>
    <div class="exam-sub">Bản truyền thống 1925 • 30 câu ngẫu nhiên</div>
  </header>

  <div class="status-bar">
    <span id="qCounter">Câu 1 / 30</span>
    <span class="score-badge" id="scoreTrack">Điểm: 0 / 60</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="pBar"></div>
  </div>

  <div class="quiz-card" id="quizCard">
    <div>
      <div class="q-number" id="qCategory">CÂU HỎI 1</div>
      <div class="q-text" id="qTitle">Đang chuẩn bị đề thi...</div>
    </div>

    <div class="options-list" id="optionsBox"></div>
  </div>

  <div class="summary-card" id="summaryBox">
    <h2 style="color: var(--green);">KẾT QUẢ BÀI THI</h2>
    <div class="score-circle" id="finalScore">0 / 60</div>
    <div id="finalComment" style="font-size: 0.95rem; color: var(--dim);"></div>

    <div style="font-weight: bold; text-align: left; margin-top: 8px;">Xem lại các câu làm sai:</div>
    <div class="wrong-review-box" id="wrongReviewList">Không sai câu nào! Quá xuất sắc!</div>

    <button class="btn-restart" onclick="startNewExam()">Làm Đề Mới (Random 30 Câu)</button>
  </div>

  <div class="modal-overlay" id="mockModal">
    <div class="modal-box">
      <div class="mock-title" id="mockTitle">Sai rồi ní ơi! 🤦‍♂️</div>
      <div class="mock-desc">Đọc lại cho kỹ đáp án đúng nè ní:</div>
      <div class="correct-info" id="mockDetail"></div>
      <button class="btn-next-modal" onclick="closeMockAndNext()">Qua câu tiếp theo ➔</button>
    </div>
  </div>

  <script>
    const masterBank = [
      { q: "Trước khi được Chúa Giê-xu kêu gọi làm môn đồ, Ma-thi-ơ làm nghề gì?", a: ["Kẻ đánh cá", "Kẻ thâu thuế", "Thầy tế lễ", "Thợ mộc"], c: 1, ref: "Ma-thi-ơ 9:9" },
      { q: "Sách Tin Lành Ma-thi-ơ được viết chủ yếu hướng tới đối tượng độc giả nào?", a: ["Người La-mã", "Người Hy-lạp", "Người Do Thái", "Các tín đồ tại Ê-phê-sô"], c: 2, ref: "Tổng quan Tin Lành Ma-thi-ơ" },
      { q: "Gia phổ Chúa Giê-xu trong Ma-thi-ơ đoạn 1 được chia thành mấy thời kỳ?", a: ["2 thời kỳ (mỗi kỳ 20 đời)", "3 thời kỳ (mỗi kỳ 14 đời)", "4 thời kỳ (mỗi kỳ 10 đời)", "3 thời kỳ (mỗi kỳ 12 đời)"], c: 1, ref: "Ma-thi-ơ 1:17" },
      { q: "Tên 'Em-ma-nu-ên' được tiên tri về Chúa Giê-xu có nghĩa là gì?", a: ["Đức Chúa Trời là Đấng Cứu Rỗi", "Đức Chúa Trời ở cùng chúng ta", "Đấng được xức dầu", "Vua muôn vua"], c: 1, ref: "Ma-thi-ơ 1:23" },
      { q: "Các thầy bác sĩ ở Đông phương đã dâng lên con trẻ Giê-xu những lễ vật nào?", a: ["Vàng, bạc, ngọc châu", "Vàng, nhũ hương, một dược", "Dầu thơm, vàng, lụa là", "Bánh, rượu, một dược"], c: 1, ref: "Ma-thi-ơ 2:11" },
      { q: "Khi vua Hê-rốt tìm giết con trẻ, thiên sứ bảo Giô-sép đưa gia đình lánh nạn sang xứ nào?", a: ["Xứ Ga-li-lê", "Xứ Sa-ma-ri", "Xứ Ê-díp-tô", "Xứ Si-ri"], c: 2, ref: "Ma-thi-ơ 2:13-14" },
      { q: "Lời tiên tri về tiếng than khóc tại Ra-ma khi Hê-rốt giết các con trẻ là của đấng tiên tri nào?", a: ["Ê-sai", "Giê-rê-mi", "Đa-ni-ên", "Mi-chê"], c: 1, ref: "Ma-thi-ơ 2:17-18" },
      { q: "Chúa Giê-xu chịu phép báp-tem bởi Giăng Báp-tít tại nơi nào?", a: ["Biển Ga-li-lê", "Ao Si-lô-ê", "Sông Giô-đanh", "Ao Bê-tết-đa"], c: 2, ref: "Ma-thi-ơ 3:13" },
      { q: "Thức ăn của Giăng Báp-tít khi ở trong đồng vắng là gì?", a: ["Bánh không men và nước lã", "Châu chấu và mật ong rừng", "Trái vả và dầu ô-liu", "Cá khô và bánh lúa mạch"], c: 1, ref: "Ma-thi-ơ 3:4" },
      { q: "Chúa Giê-xu đã kiêng ăn bao nhiêu ngày đêm trước khi chịu ma quỷ cám dỗ?", a: ["30 ngày đêm", "40 ngày đêm", "50 ngày đêm", "7 ngày đêm"], c: 1, ref: "Ma-thi-ơ 4:2" },
      { q: "Bài giảng trên núi của Chúa Giê-xu được chép trọn vẹn trong các đoạn nào?", a: ["Đoạn 1 đến đoạn 3", "Đoạn 5 đến đoạn 7", "Đoạn 10 đến đoạn 12", "Đoạn 24 đến đoạn 25"], c: 1, ref: "Ma-thi-ơ đoạn 5-7" },
      { q: "Trong Bài giảng trên núi, Chúa phán các môn đồ là gì đối với thế gian?", a: ["Muối của đất và sự sáng của thế gian", "Ngọn đuốc và men của thế gian", "Chiên giữa bầy muông sói", "Cây nho và nhánh nho"], c: 0, ref: "Ma-thi-ơ 5:13-14" },
      { q: "Bài Cầu Nguyện Chung ('Lạy Cha chúng tôi ở trên trời...') được chép trong đoạn nào?", a: ["Ma-thi-ơ đoạn 4", "Ma-thi-ơ đoạn 6", "Ma-thi-ơ đoạn 8", "Ma-thi-ơ đoạn 11"], c: 1, ref: "Ma-thi-ơ 6:9-13" },
      { q: "Người có đứa đầy tớ bị tê bại và thể hiện đức tin lớn khiến Chúa khen ngợi là ai?", a: ["Thầy tế lễ thượng phẩm", "Thầy đội tại Ca-bê-na-um", "Người đàn bà xứ Ca-na-an", "Ni-cô-đem"], c: 1, ref: "Ma-thi-ơ 8:5-10" },
      { q: "Khi Chúa Giê-xu cùng môn đồ vượt biển và gặp bão lớn, Ngài đang làm gì?", a: ["Cầu nguyện trên mũi thuyền", "Đang ngủ", "Chèo thuyền cùng môn đồ", "Đang giảng đạo"], c: 1, ref: "Ma-thi-ơ 8:24" },
      { q: "Chúa Giê-xu đuổi quỷ nhập vào bầy súc vật nào tại xứ người Ga-đa-ra?", a: ["Bầy dê", "Bầy bò", "Bầy heo", "Bầy lừa"], c: 2, ref: "Ma-thi-ơ 8:30-32" },
      { q: "Người đàn bà bị bệnh mất huyết 12 năm được chữa lành khi làm điều gì?", a: ["Được Chúa đặt tay trên đầu", "Rờ trăn áo của Chúa Giê-xu", "Tắm tại ao Si-lô-ê", "Uống nước Chúa ban"], c: 1, ref: "Ma-thi-ơ 9:20-22" },
      { q: "Trong phép lạ hóa bánh cho 5.000 người ăn, ban đầu các môn đồ chỉ có bao nhiêu thực phẩm?", a: ["7 cái bánh và vài con cá", "5 cái bánh và 2 con cá", "12 cái bánh và 5 con cá", "3 ổ bánh lúa mạch"], c: 1, ref: "Ma-thi-ơ 14:17" },
      { q: "Số lượng giỏ bánh vụn thu lại sau khi 5.000 người ăn no nê là bao nhiêu?", a: ["7 giỏ", "10 giỏ", "12 giỏ đầy", "3 giỏ"], c: 2, ref: "Ma-thi-ơ 14:20" },
      { q: "Môn đồ nào đã bước xuống thuyền và đi trên mặt nước đến cùng Chúa Giê-xu?", a: ["Gia-cơ", "Giăng", "Phi-e-rơ", "Anh-rê"], c: 2, ref: "Ma-thi-ơ 14:28-29" },
      { q: "Tại vùng Sê-sa-rê Phi-líp, Phi-e-rơ đã tuyên xưng Chúa Giê-xu là ai?", a: ["Đấng tiên tri lớn nhất", "Thầy là Đấng Christ, Con Đức Chúa Trời hằng sống", "Thầy là Giăng Báp-tít sống lại", "Vua của dân Y-sơ-ra-ên"], c: 1, ref: "Ma-thi-ơ 16:16" },
      { q: "Trên núi Hóa Hình, hai nhân vật Cựu Ước nào đã hiện ra trò chuyện với Chúa Giê-xu?", a: ["Áp-ra-ham và Đa-vít", "Môi-se và Ê-li", "Nô-ê và Đa-ni-ên", "Hê-nóc và Ê-li"], c: 1, ref: "Ma-thi-ơ 17:3" },
      { q: "Khi Phi-e-rơ hỏi có phải tha thứ cho anh em đến 7 lần chăng, Chúa Giê-xu đáp thế nào?", a: ["Đến 70 lần", "Không phải đến 7 lần, mà là 70 lần 7", "Chỉ cần 3 lần là đủ", "Đến 100 lần"], c: 1, ref: "Ma-thi-ơ 18:21-22" },
      { q: "Chúa Giê-xu đã cỡi con vật nào khi vào thành Giê-ru-sa-lem cách vinh hiển?", a: ["Một con ngựa bạch", "Một con lừa con", "Một con lạc đà", "Đi bộ cùng đoàn dân"], c: 1, ref: "Ma-thi-ơ 21:2-7" },
      { q: "Chúa Giê-xu đã rủa cây nào vì chỉ có lá mà không có trái?", a: ["Cây nho", "Cây vả", "Cây ô-liu", "Cây chà là"], c: 1, ref: "Ma-thi-ơ 21:19" },
      { q: "Điều răn thứ nhất và lớn hơn hết theo lời dạy của Chúa Giê-xu là gì?", a: ["Ngươi hãy yêu kẻ lân cận như mình", "Ngươi hãy hết lòng, hết linh hồn, hết ý mà kính mến Chúa là Đức Chúa Trời ngươi", "Ngươi chớ giết người", "Hãy giữ ngày Sa-bát"], c: 1, ref: "Ma-thi-ơ 22:37-38" },
      { q: "Trong thí dụ về 10 người nữ đồng trinh, có bao nhiêu người khôn và người dại?", a: ["7 khôn, 3 dại", "5 khôn, 5 dại", "6 khôn, 4 dại", "8 khôn, 2 dại"], c: 1, ref: "Ma-thi-ơ 25:1-2" },
      { q: "Trong thí dụ về các ta-lâng, đầy tớ nhận 1 ta-lâng đã làm gì với số tiền đó?", a: ["Đem cho vay lấy lãi", "Đem chôn giấu dưới đất", "Mua sắm lụa là buôn bán", "Làm mất hết tiền"], c: 1, ref: "Ma-thi-ơ 25:18" },
      { q: "Giu-đa Ích-ca-ri-ốt đã nộp Chúa Giê-xu cho các thầy tế lễ cả với giá bao nhiêu?", a: ["20 đồng bạc", "30 đồng bạc", "50 đồng bạc", "100 đồng tiền vàng"], c: 1, ref: "Ma-thi-ơ 26:15" },
      { q: "Nơi Chúa Giê-xu cùng các môn đồ đến cầu nguyện trong đêm Ngài bị bắt là vườn gì?", a: ["Vườn Ê-đen", "Vườn Ghết-sê-ma-nê", "Vườn Ô-liu", "Vườn Bê-tha-ni"], c: 1, ref: "Ma-thi-ơ 26:36" },
      { q: "Phi-e-rơ đã chối Chúa Giê-xu mấy lần trước khi gà gáy?", a: ["1 lần", "2 lần", "3 lần", "4 lần"], c: 2, ref: "Ma-thi-ơ 26:75" },
      { q: "Tên người tử tù hung phạm được tha thay cho Chúa Giê-xu là ai?", a: ["Ba-ra-ba", "Si-môn", "Man-chu", "Ca-i-phe"], c: 0, ref: "Ma-thi-ơ 27:16-26" },
      { q: "Ai là người bị ép vác cây thập tự thay cho Chúa Giê-xu trên đường lên đồi?", a: ["Giô-sép người A-ri-ma-thê", "Si-môn người Sy-ren", "Ni-cô-đem", "Gia-cơ"], c: 1, ref: "Ma-thi-ơ 27:32" },
      { q: "Nơi Chúa Giê-xu bị đóng đinh có tên gọi là Gô-gô-tha, nghĩa là gì?", a: ["Nơi sầu não", "Chỗ Cái Sọ", "Đồi Bình An", "Nơi Phán Xét"], c: 1, ref: "Ma-thi-ơ 27:33" },
      { q: "Câu kêu 'Ê-li, Ê-li, lam-ma sa-bách-ta-ni' của Chúa trên thập tự giá có nghĩa là gì?", a: ["Mọi việc đã được trọn", "Đức Chúa Trời tôi ôi, Đức Chúa Trời tôi ôi, sao Ngài lìa bỏ tôi?", "Lạy Cha, con giao linh hồn lại trong tay Cha", "Xin Cha tha tội cho họ"], c: 1, ref: "Ma-thi-ơ 27:46" },
      { q: "Khi Chúa Giê-xu trút hơi thở cuối cùng, hiện tượng kỳ lạ nào xảy ra trong đền thờ?", a: ["Hòm giao ước biến mất", "Màn trong đền thờ xé đôi từ trên chí dưới", "Các bàn thờ sụp đổ", "Đèn vàng vụt tắt"], c: 1, ref: "Ma-thi-ơ 27:51" },
      { q: "Người môn đồ giàu có đã đến xin thi thể Chúa Giê-xu để chôn trong mộ đá mới là ai?", a: ["Ni-cô-đem", "Giô-sép người A-ri-ma-thê", "Xa-chê", "Thầy đội La-mã"], c: 1, ref: "Ma-thi-ơ 27:57-60" },
      { q: "Các thầy tế lễ cả đã đưa bạc cho lính canh mộ để phao tin dối trá nào?", a: ["Chúa không chết thật", "Môn đồ đến ăn trộm xác ban đêm khi lính đang ngủ", "Thiên sứ đã mang xác đi", "Lính đã tự ý dời mộ"], c: 1, ref: "Ma-thi-ơ 28:12-13" },
      { q: "Đại Mạng Lệnh ('Hãy đi dạy dỗ muôn dân...') được chép ở phân đoạn nào?", a: ["Ma-thi-ơ 26:1-5", "Ma-thi-ơ 28:18-20", "Ma-thi-ơ 25:31-40", "Ma-thi-ơ 18:15-20"], c: 1, ref: "Ma-thi-ơ 28:18-20" },
      { q: "Trong Ma-thi-ơ 1, có bao nhiêu người nữ được trực tiếp nhắc tên trong gia phổ Chúa?", a: ["3 người", "4 người", "5 người (Tha-ma, Ra-háp, Ru-tơ, vợ U-ri, Ma-ri)", "Không có người nữ nào"], c: 2, ref: "Ma-thi-ơ 1:3-16" },
      { q: "Tên gọi khác của sứ đồ Ma-thi-ơ trong các sách Tin Lành khác là gì?", a: ["Lê-vi", "Thê-đa", "Ba-ra-ba", "Ba-thê-lê-mi"], c: 0, ref: "Mác 2:14 / Lu-ca 5:27" },
      { q: "Trong phép lạ hóa bánh lần thứ hai cho 4.000 người ăn, số giỏ bánh vụn gom lại là bao nhiêu?", a: ["12 giỏ", "7 giỏ", "5 giỏ", "10 giỏ"], c: 1, ref: "Ma-thi-ơ 15:37" },
      { q: "Quan tổng đốc La-mã xử án Chúa Giê-xu và rửa tay trước đoàn dân là ai?", a: ["Hê-rốt Ạc-ríp-ba", "Bôn-xơ Phi-lát", "Phê-lít", "Phiê-tu"], c: 1, ref: "Ma-thi-ơ 27:24" },
      { q: "Thành phố được gọi là 'thành của Ngài' nơi Chúa thi hành nhiều phép lạ tại Ga-li-lê là thành nào?", a: ["Bết-lê-hem", "Ca-bê-na-um", "Na-xa-rét", "Giê-ri-cô"], c: 1, ref: "Ma-thi-ơ 9:1" },
      { q: "Tiếng phán từ trời khi Chúa Giê-xu vừa chịu phép báp-tem xong phán điều gì?", a: ["Nầy là Vua dân Do Thái", "Nầy là Con yêu dấu của ta, đẹp lòng ta mọi đường", "Hãy nghe lời Ngài", "Đấng Mê-si đã đến"], c: 1, ref: "Ma-thi-ơ 3:17" },
      { q: "Ai là mẹ của hai sứ đồ Gia-cơ và Giăng đã đến xin cho hai con ngồi hai bên Chúa?", a: ["Ma-ri", "Bà mẹ của các con Xê-bê-đê", "Ê-li-sa-bét", "Sa-lô-mê"], c: 1, ref: "Ma-thi-ơ 20:20-21" },
      { q: "Trong thí dụ về người gieo giống, loại đất nào giúp hạt giống kết quả một hạt ra một trăm, sáu chục, ba chục?", a: ["Đất dọc đường", "Đất đá sỏi", "Đất bụi gai", "Đất tốt"], c: 3, ref: "Ma-thi-ơ 13:8" },
      { q: "Khi người Pha-ri-si hỏi về việc nộp thuế cho Sê-sa, Chúa bảo họ đưa xem đồng tiền gì?", a: ["Đồng bạc si-ếc-lơ", "Đồng tiền thuế (đơ-ni-ê)", "Đồng hai xu của người góa bụa", "Nén vàng"], c: 1, ref: "Ma-thi-ơ 22:19" },
      { q: "Chúa Giê-xu phán: 'Kẻ nào bền chí cho đến cuối cùng, thì sẽ được...'", a: ["Làm quan lớn", "Rỗi linh hồn", "Nhiều của cải", "Sống thọ"], c: 1, ref: "Ma-thi-ơ 24:13" },
      { q: "Bảng chữ lính đóng đinh phía trên đầu Chúa Giê-xu ghi nội dung gì?", a: ["Kẻ tự xưng là Đấng Christ", "NGƯỜI NÀY LÀ JÊSUS, VUA DÂN GIU-ĐA", "Kẻ phạm thượng", "Na-xa-rét"], c: 1, ref: "Ma-thi-ơ 27:37" }
    ];

    const mockList = [
      "Sai rồi ní ơi! 🤦‍♂️",
      "Hổng đúng rồi bạn! 😜",
      "Lêu lêu trật lất! 🤪",
      "Hehe làm lại đi ní! 🙃",
      "Đánh lụi coi chừng đội sổ nha ní! 😂",
      "Kinh Thánh đoạn này rõ mồn một mà ní! 🧐",
      "Sai bét nhè rồi ní ơi! 🌶️",
      "Câu này dễ mà đánh sai hả ní! 🤣"
    ];

    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let wrongAnswers = [];
    let isLocked = false;

    function safeShuffle(arr) {
      let copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        let temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function startNewExam() {
      try {
        const picked = safeShuffle(masterBank).slice(0, 30);
        
        currentQuestions = picked.map(function(item) {
          let choicesWithFlag = item.a.map(function(text, idx) {
            return { text: text, isCorrect: (idx === item.c) };
          });
          let shuffled = safeShuffle(choicesWithFlag);
          let correctIdx = 0;
          for (let k = 0; k < shuffled.length; k++) {
            if (shuffled[k].isCorrect) {
              correctIdx = k;
              break;
            }
          }
          return {
            q: item.q,
            ref: item.ref,
            options: shuffled.map(function(c) { return c.text; }),
            correctIdx: correctIdx
          };
        });

        currentIdx = 0;
        score = 0;
        wrongAnswers = [];
        isLocked = false;

        document.getElementById('quizCard').style.display = 'flex';
        document.getElementById('summaryBox').style.display = 'none';
        updateUI();
        loadQuestion();
      } catch (err) {
        document.getElementById('qTitle').textContent = "Lỗi nạp đề: " + err.message;
      }
    }

    function updateUI() {
      document.getElementById('qCounter').textContent = "Câu " + (currentIdx + 1) + " / " + currentQuestions.length;
      document.getElementById('scoreTrack').textContent = "Điểm: " + score + " / " + (currentQuestions.length * 2);
      const percent = (currentIdx / currentQuestions.length) * 100;
      document.getElementById('pBar').style.width = percent + "%";
    }

    function loadQuestion() {
      isLocked = false;
      const qData = currentQuestions[currentIdx];
      const card = document.getElementById('quizCard');
      card.className = 'quiz-card';

      document.getElementById('qCategory').textContent = "CÂU HỎI " + (currentIdx + 1);
      document.getElementById('qTitle').textContent = qData.q;

      const optBox = document.getElementById('optionsBox');
      optBox.innerHTML = '';

      const tags = ['A', 'B', 'C', 'D'];
      for (let i = 0; i < qData.options.length; i++) {
        (function(index) {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = '<span class="opt-tag">' + tags[index] + '</span> <span>' + qData.options[index] + '</span>';
          btn.onclick = function() { handleChoice(btn, index); };
          optBox.appendChild(btn);
        })(i);
      }

      updateUI();
    }

    function handleChoice(btnEl, chosenIdx) {
      if (isLocked) return;
      isLocked = true;

      const qData = currentQuestions[currentIdx];
      const card = document.getElementById('quizCard');
      const allBtns = document.querySelectorAll('.opt-btn');

      if (chosenIdx === qData.correctIdx) {
        score += 2;
        if (navigator.vibrate) navigator.vibrate(60);
        btnEl.className = 'opt-btn correct';
        card.className = 'quiz-card correct-anim';

        updateUI();

        setTimeout(function() {
          proceedNext();
        }, 750);
      } else {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        btnEl.className = 'opt-btn wrong';
        card.className = 'quiz-card shake-anim';

        if (allBtns[qData.correctIdx]) {
          allBtns[qData.correctIdx].className = 'opt-btn correct';
        }

        wrongAnswers.push({
          q: qData.q,
          chosen: qData.options[chosenIdx],
          correct: qData.options[qData.correctIdx],
          ref: qData.ref
        });

        setTimeout(function() {
          const randMock = mockList[Math.floor(Math.random() * mockList.length)];
          document.getElementById('mockTitle').textContent = randMock;
          document.getElementById('mockDetail').innerHTML = 
            '<b>Đáp án đúng:</b> ' + qData.options[qData.correctIdx] + '<br>' +
            '<span style="color:var(--dim); font-size:0.85rem;">(Tham khảo: ' + qData.ref + ')</span>';
          document.getElementById('mockModal').style.display = 'flex';
        }, 400);
      }
    }

    function closeMockAndNext() {
      document.getElementById('mockModal').style.display = 'none';
      proceedNext();
    }

    function proceedNext() {
      currentIdx++;
      if (currentIdx >= currentQuestions.length) {
        showSummary();
      } else {
        loadQuestion();
      }
    }

    function showSummary() {
      document.getElementById('quizCard').style.display = 'none';
      document.getElementById('summaryBox').style.display = 'flex';
      document.getElementById('pBar').style.width = '100%';

      const finalPts = score;
      const totalPts = currentQuestions.length * 2;
      document.getElementById('finalScore').textContent = finalPts + " / " + totalPts;

      let comment = "";
      if (finalPts === totalPts) comment = "Đỉnh nóc kịch trần! Bạn sẵn sàng ẵm giải Nhất Giáng Sinh năm nay rồi!";
      else if (finalPts >= 50) comment = "Rất tốt! Điểm số xuất sắc, chỉ cần ôn lại vài câu gài bẫy là hoàn hảo.";
      else if (finalPts >= 40) comment = "Khá ổn, nhưng vẫn còn sai sót ở các chi tiết số liệu và tên riêng.";
      else comment = "Cần cày lại sách Ma-thi-ơ gấp ní ơi, sai nhiều câu căn bản quá!";
      document.getElementById('finalComment').textContent = comment;

      const reviewBox = document.getElementById('wrongReviewList');
      if (wrongAnswers.length === 0) {
        reviewBox.innerHTML = "<span style='color:var(--green);'>Tuyệt đối chính xác 30/30 câu!</span>";
      } else {
        reviewBox.innerHTML = wrongAnswers.map(function(w, i) {
          return '<div style="margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px;">' +
            '<b>' + (i + 1) + '. ' + w.q + '</b><br>' +
            '<span style="color:var(--red);">Bạn chọn: ' + w.chosen + '</span><br>' +
            '<span style="color:var(--green);">Đáp án đúng: ' + w.correct + '</span> <i>(' + w.ref + ')</i>' +
          '</div>';
        }).join('');
      }
    }

    // Đảm bảo DOM load hoàn tất 100% mới khởi động game
    window.addEventListener('DOMContentLoaded', function() {
      startNewExam();
    });
  </script>
</body>
