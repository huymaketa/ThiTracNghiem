<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thi Kinh Thánh: Tin Lành Ma-thi-ơ</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181825">
  <style>
    :root {
      --bg: #11111b;
      --card: #1e1e2e;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --dim: #a6adc8;
      --green: #a6e3a1;
      --green-bg: rgba(166, 227, 161, 0.18);
      --red: #f38ba8;
      --red-bg: rgba(243, 139, 168, 0.18);
      --border: #313244;
      --opt-bg: #181825;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .exam-title { font-size: 1.15rem; font-weight: bold; color: var(--accent); text-transform: uppercase; }
    .bank-info { font-size: 0.8rem; color: var(--dim); margin-top: 3px; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .score-badge { color: #f9e2af; }

    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #313244;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .shake-anim {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--red) !important;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .correct-anim {
      animation: popGreen 0.6s ease-out both;
      border-color: var(--green) !important;
    }
    @keyframes popGreen {
      0% { transform: scale(1); box-shadow: 0 0 0 rgba(166, 227, 161, 0); }
      40% { transform: scale(1.02); box-shadow: 0 0 25px rgba(166, 227, 161, 0.4); }
      100% { transform: scale(1); }
    }

    .q-number {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .q-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      background: var(--opt-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      color: var(--text);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
      transition: all 0.15s ease;
    }
    .opt-btn:active { transform: scale(0.98); }
    .opt-tag {
      font-weight: bold;
      color: var(--accent);
      background: rgba(137, 180, 250, 0.15);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .opt-btn.correct {
      background: var(--green-bg);
      border-color: var(--green);
      color: var(--green);
      font-weight: bold;
    }
    .opt-btn.correct .opt-tag {
      background: var(--green);
      color: #11111b;
    }
    .opt-btn.wrong {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }
    .opt-btn.wrong .opt-tag {
      background: var(--red);
      color: #11111b;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: #181825;
      border: 2px solid var(--red);
      border-radius: 16px;
      padding: 22px 18px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .mock-title { font-size: 1.35rem; font-weight: 900; color: var(--red); margin-bottom: 8px; }
    .mock-desc { font-size: 0.9rem; color: var(--dim); margin-bottom: 12px; }
    .correct-info {
      background: #11111b;
      padding: 12px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      color: var(--green);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 18px;
      text-align: left;
    }
    .btn-next-modal {
      background: var(--red);
      color: #11111b;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px 18px;
      text-align: center;
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .score-circle {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent);
      margin: 8px 0;
    }
    .btn-restart {
      background: var(--accent);
      color: #11111b;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .wrong-review-box {
      text-align: left;
      max-height: 250px;
      overflow-y: auto;
      background: #11111b;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="exam-title">Đề Thi Tin Lành Ma-thi-ơ</div>
    <div class="bank-info" id="bankInfo">Đang nạp ngân hàng câu hỏi...</div>
  </header>

  <div class="status-bar">
    <span id="qCounter">Câu 1 / 30</span>
    <span class="score-badge" id="scoreTrack">Điểm: 0 / 60</span>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="pBar"></div>
  </div>

  <div class="quiz-card" id="quizCard">
    <div>
      <div class="q-number" id="qCategory">CÂU HỎI 1</div>
      <div class="q-text" id="qTitle">Đang kết nối dữ liệu GitHub...</div>
    </div>
    <div class="options-list" id="optionsBox"></div>
  </div>

  <div class="summary-card" id="summaryBox">
    <h2 style="color: var(--green);">KẾT QUẢ BÀI THI</h2>
    <div class="score-circle" id="finalScore">0 / 60</div>
    <div id="finalComment" style="font-size: 0.95rem; color: var(--dim);"></div>

    <div style="font-weight: bold; text-align: left; margin-top: 8px;">Xem lại các câu làm sai:</div>
    <div class="wrong-review-box" id="wrongReviewList">Không sai câu nào! Quá xuất sắc!</div>

    <button class="btn-restart" onclick="startNewExam()">Làm Đề Mới (Random 30 Câu)</button>
  </div>

  <div class="modal-overlay" id="mockModal">
    <div class="modal-box">
      <div class="mock-title" id="mockTitle">Sai rồi ní ơi! 🤦‍♂️</div>
      <div class="mock-desc">Đọc lại cho kỹ đáp án đúng nè ní:</div>
      <div class="correct-info" id="mockDetail"></div>
      <button class="btn-next-modal" onclick="closeMockAndNext()">Qua câu tiếp theo ➔</button>
    </div>
  </div>

  <script>
    const mockList = [
      "Sai rồi ní ơi! 🤦‍♂️",
      "Hổng đúng rồi bạn! 😜",
      "Lêu lêu trật lất! 🤪",
      "Hehe làm lại đi ní! 🙃",
      "Đánh lụi coi chừng đội sổ nha ní! 😂",
      "Kinh Thánh đoạn này rõ mồn một mà ní! 🧐",
      "Sai bét nhè rồi ní ơi! 🌶️",
      "Câu này dễ mà đánh sai hả ní! 🤣"
    ];

    let activeBank = [];
    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let wrongAnswers = [];
    let isLocked = false;

    // Bộ phân tích file text chứa 300 câu hỏi
    function parseTxtBank(rawText) {
      const parsed = [];
      const blocks = rawText.split(/Câu\s+\d+:/i);

      for (let i = 1; i < blocks.length; i++) {
        const block = blocks[i].trim();
        if (!block) continue;

        const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length < 3) continue;

        const qText = lines[0].replace(/^\(\*\*\)\s*/, '').trim();
        const options = {};
        let correctRaw = '';
        let ref = 'Sách Ma-thi-ơ';

        for (let j = 1; j < lines.length; j++) {
          const line = lines[j];
          const mOpt = line.match(/^([a-f])\.\s*(.*)/i);
          const mAns = line.match(/^Đáp án:\s*([^|]+)(?:\|\s*TDKT:\s*(.*))?/i);

          if (mOpt) {
            options[mOpt[1].toLowerCase()] = mOpt[2].trim();
          } else if (mAns) {
            correctRaw = mAns[1].trim().toLowerCase();
            if (mAns[2]) ref = mAns[2].trim();
          }
        }

        const answers = correctRaw.split(/[,;\s]+/).filter(Boolean);
        let choices = [];
        let correctIdx = 0;

        if (answers.length > 1 || Object.keys(options).length > 4) {
          const correctCombined = answers.map(k => options[k]).filter(Boolean).join(', ');
          choices = [
            correctCombined,
            "Chỉ có: " + (options[answers[0]] || "ý đầu") + " là đúng",
            "Cả các ý trên đều không được Kinh Thánh chép",
            "Không có đáp án nào chính xác"
          ];
          correctIdx = 0;
        } else {
          const keys = ['a', 'b', 'c', 'd'];
          choices = keys.map(k => options[k] || 'Không có');
          const single = answers[0] || 'a';
          correctIdx = keys.indexOf(single);
          if (correctIdx === -1) correctIdx = 0;
        }

        while (choices.length < 4) choices.push('Ý khác');

        parsed.push({
          q: qText,
          a: choices.slice(0, 4),
          c: correctIdx,
          ref: ref
        });
      }
      return parsed;
    }

    // Tự động tải ngầm questions.txt từ cùng thư mục trên GitHub
    async function fetchQuestionsFromGitHub() {
      const qTitleEl = document.getElementById('qTitle');
      try {
        // Thêm timestamp để ép trình duyệt luôn tải file mới nhất, tránh cache
        const res = await fetch('questions.txt?t=' + Date.now());
        if (!res.ok) {
          throw new Error('Chưa tìm thấy file questions.txt trên GitHub (Mã lỗi: ' + res.status + ')');
        }
        const text = await res.text();
        const parsed = parseTxtBank(text);

        if (parsed.length === 0) {
          throw new Error('File questions.txt trống hoặc không đúng định dạng câu hỏi');
        }

        activeBank = parsed;
        document.getElementById('bankInfo').textContent = 'Ngân hàng: ' + activeBank.length + ' câu (Random 30 câu mỗi đề)';
        startNewExam();
      } catch (err) {
        qTitleEl.textContent = 'Lỗi nạp đề: ' + err.message + '. Hãy đảm bảo file questions.txt đã được tải lên cùng thư mục với index.html.';
      }
    }

    function safeShuffle(arr) {
      let copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        let temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function startNewExam() {
      try {
        const examSize = Math.min(30, activeBank.length);
        const picked = safeShuffle(activeBank).slice(0, examSize);

        currentQuestions = picked.map(function(item) {
          let choicesWithFlag = item.a.map(function(text, idx) {
            return { text: text, isCorrect: (idx === item.c) };
          });
          let shuffled = safeShuffle(choicesWithFlag);
          let correctIdx = 0;
          for (let k = 0; k < shuffled.length; k++) {
            if (shuffled[k].isCorrect) {
              correctIdx = k;
              break;
            }
          }
          return {
            q: item.q,
            ref: item.ref,
            options: shuffled.map(function(c) { return c.text; }),
            correctIdx: correctIdx
          };
        });

        currentIdx = 0;
        score = 0;
        wrongAnswers = [];
        isLocked = false;

        document.getElementById('quizCard').style.display = 'flex';
        document.getElementById('summaryBox').style.display = 'none';
        updateUI();
        loadQuestion();
      } catch (err) {
        document.getElementById('qTitle').textContent = "Lỗi khởi tạo đề: " + err.message;
      }
    }

    function updateUI() {
      document.getElementById('qCounter').textContent = "Câu " + (currentIdx + 1) + " / " + currentQuestions.length;
      document.getElementById('scoreTrack').textContent = "Điểm: " + score + " / " + (currentQuestions.length * 2);
      const percent = (currentIdx / currentQuestions.length) * 100;
      document.getElementById('pBar').style.width = percent + "%";
    }

    function loadQuestion() {
      isLocked = false;
      const qData = currentQuestions[currentIdx];
      const card = document.getElementById('quizCard');
      card.className = 'quiz-card';

      document.getElementById('qCategory').textContent = "CÂU HỎI " + (currentIdx + 1);
      document.getElementById('qTitle').textContent = qData.q;

      const optBox = document.getElementById('optionsBox');
      optBox.innerHTML = '';

      const tags = ['A', 'B', 'C', 'D'];
      for (let i = 0; i < qData.options.length; i++) {
        (function(index) {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.innerHTML = '<span class="opt-tag">' + tags[index] + '</span> <span>' + qData.options[index] + '</span>';
          btn.onclick = function() { handleChoice(btn, index); };
          optBox.appendChild(btn);
        })(i);
      }

      updateUI();
    }

    function handleChoice(btnEl, chosenIdx) {
      if (isLocked) return;
      isLocked = true;

      const qData = currentQuestions[currentIdx];
      const card = document.getElementById('quizCard');
      const allBtns = document.querySelectorAll('.opt-btn');

      if (chosenIdx === qData.correctIdx) {
        score += 2;
        if (navigator.vibrate) navigator.vibrate(60);
        btnEl.className = 'opt-btn correct';
        card.className = 'quiz-card correct-anim';

        updateUI();

        setTimeout(function() {
          proceedNext();
        }, 750);
      } else {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        btnEl.className = 'opt-btn wrong';
        card.className = 'quiz-card shake-anim';

        if (allBtns[qData.correctIdx]) {
          allBtns[qData.correctIdx].className = 'opt-btn correct';
        }

        wrongAnswers.push({
          q: qData.q,
          chosen: qData.options[chosenIdx],
          correct: qData.options[qData.correctIdx],
          ref: qData.ref
        });

        setTimeout(function() {
          const randMock = mockList[Math.floor(Math.random() * mockList.length)];
          document.getElementById('mockTitle').textContent = randMock;
          document.getElementById('mockDetail').innerHTML = 
            '<b>Đáp án đúng:</b> ' + qData.options[qData.correctIdx] + '<br>' +
            '<span style="color:var(--dim); font-size:0.85rem;">(Tham khảo: ' + qData.ref + ')</span>';
          document.getElementById('mockModal').style.display = 'flex';
        }, 400);
      }
    }

    function closeMockAndNext() {
      document.getElementById('mockModal').style.display = 'none';
      proceedNext();
    }

    function proceedNext() {
      currentIdx++;
      if (currentIdx >= currentQuestions.length) {
        showSummary();
      } else {
        loadQuestion();
      }
    }

    function showSummary() {
      document.getElementById('quizCard').style.display = 'none';
      document.getElementById('summaryBox').style.display = 'flex';
      document.getElementById('pBar').style.width = '100%';

      const finalPts = score;
      const totalPts = currentQuestions.length * 2;
      document.getElementById('finalScore').textContent = finalPts + " / " + totalPts;

      let comment = "";
      if (finalPts === totalPts) comment = "Đỉnh nóc kịch trần! Bạn sẵn sàng ẵm giải Nhất Giáng Sinh năm nay rồi!";
      else if (finalPts >= 50) comment = "Rất tốt! Điểm số xuất sắc, chỉ cần ôn lại vài câu gài bẫy là hoàn hảo.";
      else if (finalPts >= 40) comment = "Khá ổn, nhưng vẫn còn sai sót ở các chi tiết số liệu và tên riêng.";
      else comment = "Cần cày lại sách Ma-thi-ơ gấp ní ơi, sai nhiều câu căn bản quá!";
      document.getElementById('finalComment').textContent = comment;

      const reviewBox = document.getElementById('wrongReviewList');
      if (wrongAnswers.length === 0) {
        reviewBox.innerHTML = "<span style='color:var(--green);'>Tuyệt đối chính xác 30/30 câu!</span>";
      } else {
        reviewBox.innerHTML = wrongAnswers.map(function(w, i) {
          return '<div style="margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px;">' +
            '<b>' + (i + 1) + '. ' + w.q + '</b><br>' +
            '<span style="color:var(--red);">Bạn chọn: ' + w.chosen + '</span><br>' +
            '<span style="color:var(--green);">Đáp án đúng: ' + w.correct + '</span> <i>(' + w.ref + ')</i>' +
          '</div>';
        }).join('');
      }
    }

    // Tự động kích hoạt nạp ngầm từ GitHub khi tải trang
    window.addEventListener('DOMContentLoaded', function() {
      fetchQuestionsFromGitHub();
    });
  </script>
</body>
</html>
